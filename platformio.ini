; ── Shared Configuration ──────────────────────────────────────
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Filesystem
board_build.filesystem = littlefs

; Library dependencies
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson@^7.3.0
    ayushsharma82/ElegantOTA@^3.1.5

; Build flags
build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    '-DFIRMWARE_VERSION="1.0.0"'

; ── Serial Upload (Initial Flash via USB) ─────────────────────
; Usage: pio run -e serial -t upload        (flash firmware)
;        pio run -e serial -t uploadfs      (flash LittleFS)
[env:serial]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
upload_protocol = esptool
upload_speed = 921600

; ── OTA Upload (Wireless via ArduinoOTA) ──────────────────────
; Usage: pio run -e ota -t upload
; NOTE: Requires the ESP32 to be running and connected to WiFi.
;       For browser-based OTA, use the web portal's OTA page instead.
[env:ota]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
upload_protocol = espota
upload_port = microrouter.local
upload_flags =
    --auth=admin

; ── Native Backend Unit Tests ──────────────────────────────────
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
build_src_filter = +<native_main.cpp>
test_build_src = no
build_flags = -DNATIVE_BUILD
