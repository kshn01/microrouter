name: Release & Distribute Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Portal Bundle
        run: |
          cd frontend
          npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Compile ESP32-S3 Firmware
        run: |
          pio run -e serial

      - name: Compile LittleFS Filesystem Image
        run: |
          pio run -e serial -t buildfs

      - name: Stage Release Binaries & Merge Factory Image
        run: |
          mkdir -p dist
          
          # Copy application binary for OTA
          cp .pio/build/serial/firmware.bin dist/microrouter-esp32s3-firmware.bin
          
          # Copy LittleFS web portal binary for OTA
          cp .pio/build/serial/littlefs.bin dist/microrouter-esp32s3-littlefs.bin
          
          # Create unified factory image for first-time flash (Offset 0x0)
          python -m esptool --chip esp32s3 merge_bin \
            -o dist/microrouter-esp32s3-factory-merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 8MB \
            0x000000 .pio/build/serial/bootloader.bin \
            0x008000 .pio/build/serial/partitions.bin \
            0x010000 .pio/build/serial/firmware.bin \
            0x610000 .pio/build/serial/littlefs.bin

          # Generate SHA256 Checksums
          cd dist
          sha256sum microrouter-esp32s3-*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "MicroRouter ${{ steps.vars.outputs.TAG_NAME }}"
          files: |
            dist/microrouter-esp32s3-firmware.bin
            dist/microrouter-esp32s3-littlefs.bin
            dist/microrouter-esp32s3-factory-merged.bin
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
